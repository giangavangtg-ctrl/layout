<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục Responsive cơ bản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Phần đầu trang -->
        <div class="header">
            <h2>Header</h2>
        </div>

        <!-- Phần thân trang chứa 2 cột -->
        <div class="wrapper">
            <!-- Cột nội dung chính -->
            <div class="main-content">
                <h2>Nội dung chính (Main Content)</h2>
                <p>Khu vực này hiển thị bài viết, hình ảnh hoặc các thông tin quan trọng nhất của trang web.</p>
            </div>

            <!-- Cột thanh bên -->
            <div class="sidebar">
                <h2>Thanh bên (Sidebar)</h2>
                <p>Khu vực chứa menu phụ, quảng cáo hoặc liên kết nổi bật.</p>
            </div>
        </div>

        <!-- Phần chân trang -->
        <div class="footer">
            <p>Footer - Bản quyền © 2024</p>
        </div>
    </div>

</body>
</html>
